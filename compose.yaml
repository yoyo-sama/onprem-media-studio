# docker compose up -d --build   →   http://<host>:8090
services:
  studio:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: studio:dev
    container_name: studio
    restart: unless-stopped
    ports:
      # Host port: STUDIO_HOST_PORT in .env when 8090 is taken (AI Content Studio 1.4 uses it).
      - "${STUDIO_HOST_PORT:-8090}:8090"
    environment:
      # Optional, needed for gated models (Krea 2). Put it in .env, never here.
      HF_TOKEN: ${HF_TOKEN:-}
      STUDIO_APP_NAME: ${STUDIO_APP_NAME:-OnPrem Media Studio}
      # LLM of the assistant and the enrichments: gemma4-26b-a4b (default) or gemma4-e4b (smaller).
      STUDIO_LLM_MODEL: ${STUDIO_LLM_MODEL:-gemma4-26b-a4b}
    volumes:
      # Models (hundreds of GB) and renders live outside the image.
      - ${STUDIO_DATA:-./data}:/data
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
