[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name follows the product name; the import package stays the
# neutral `studio`, so a rename never touches imports.
name = "onprem-media-studio"
version = "2.0.0.dev0"
description = "Self-contained local AI image and video studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "huggingface_hub>=0.34",
    "httpx>=0.27",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy"]
# Image engines. torch and torchvision (the Qwen processors need it) are not
# listed: they come from the NGC base image (Docker) or from the platform's own
# build (bare metal), never from a generic wheel.
# diffusers is pinned: 0.42 is the first release with Krea2Pipeline and
# QwenImage21Pipeline, and a pipeline's defaults can change between releases.
inference = [
    "diffusers==0.42.1",
    "transformers>=5.17",
    "accelerate>=1.0",
    "peft>=0.17",
    "safetensors>=0.4",
]
# MiniMax H3 runs on FastVideo, which is not on PyPI in a GB10 build: the Docker
# image builds it from source (docker/Dockerfile, docker/fastvideo-requirements.txt).

[tool.setuptools]
packages = ["studio", "studio.pipelines"]

[tool.setuptools.package-data]
studio = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
