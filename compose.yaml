# docker compose up -d --build   →   http://<host>:8090
services:
  studio:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Set by the updater service only (the commit it rebuilds); empty for a build by hand.
        STUDIO_COMMIT: ${STUDIO_COMMIT:-}
    image: studio:dev
    container_name: studio
    restart: unless-stopped
    ports:
      # Host port: STUDIO_HOST_PORT in .env when 8090 is taken (AI Content Studio 1.4 uses it).
      - "${STUDIO_HOST_PORT:-8090}:8090"
    environment:
      # Optional, needed for gated models (Krea 2). Put it in .env, never here.
      HF_TOKEN: ${HF_TOKEN:-}
      # Empty: the name set in studio/config.py (APP_NAME).
      STUDIO_APP_NAME: ${STUDIO_APP_NAME:-}
      # LLM of the assistant and the enrichments (catalog id; gemma4-26b-a4b is the only one).
      STUDIO_LLM_MODEL: ${STUDIO_LLM_MODEL:-gemma4-26b-a4b}
      # In-app update: the updater service below.
      STUDIO_UPDATER_URL: http://updater:8091
    volumes:
      # Models (hundreds of GB) and renders live outside the image.
      - ${STUDIO_DATA:-./data}:/data
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # In-app update ("Update" panel): git pull in this folder, rebuild of the studio image,
  # restart of the studio container once no job runs (docker/updater/server.py). No port is
  # published: only the studio container reaches it. The Docker socket lets it run
  # docker compose on the host, as you would.
  updater:
    build: docker/updater
    image: studio-updater:dev
    container_name: studio-updater
    restart: unless-stopped
    environment:
      UPDATER_BRANCH: ${STUDIO_UPDATE_BRANCH:-main}
      # Private repository: a GitHub token that can read it, in .env. Never written here.
      UPDATER_GIT_TOKEN: ${STUDIO_GIT_TOKEN:-}
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
