[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name follows the product name; the import package stays the
# neutral `studio`, so a rename never touches imports.
name = "onprem-media-studio"
version = "2.0.0.dev0"
description = "Self-contained local AI image and video studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "huggingface_hub>=0.34",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["studio", "studio.pipelines"]

[tool.setuptools.package-data]
studio = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
